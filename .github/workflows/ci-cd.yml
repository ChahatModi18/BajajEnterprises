name: Bajaj Enterprises CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Verification & Tests (FastAPI + SQLAlchemy + Alembic)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend CI (Python 3.11 & FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify database migrations (Alembic)
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Verify CLI seeding scripts
        working-directory: ./backend
        run: |
          python -m app.cli.create_admin --email ci_admin@bajajenterprises.com --password CiAdmin@Bajaj2026 --name "CI Administrator"
          python -m app.cli.seed_demo_data

      - name: Run Pytest test suite
        working-directory: ./backend
        run: |
          pytest -v

  # ---------------------------------------------------------------------------
  # 2. Frontend Build & Typecheck (React 18 + TypeScript + Vite)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend CI (React 18 & Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Build frontend production bundle (TypeScript & Vite)
        working-directory: ./frontend
        run: |
          npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Production Deployment Gate
  # ---------------------------------------------------------------------------
  deploy:
    name: Production Deployment
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render Backend Webhook (Optional)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render redeployment hook..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"

      - name: Deployment Status Summary
        run: |
          echo "=========================================================="
          echo "CI Checks passed for Backend & Frontend."
          echo "Repository: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Production deployment pipeline completed successfully."
          echo "=========================================================="

