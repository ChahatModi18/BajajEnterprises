services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: bajaj-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://www.bajajenterprises.com","https://bajajenterprises.com","https://bajajenterprises.vercel.app","https://bajaj-frontend.onrender.com"]'

  # 2. React Vite Frontend Static Site
  - type: web
    name: bajaj-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bajaj-backend
          property: host
