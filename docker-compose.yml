version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bajaj_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bajaj_enterprises
      MYSQL_USER: bajaj_user
      MYSQL_PASSWORD: bajaj_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bajaj_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://bajaj_user:bajaj_password@mysql:3306/bajaj_enterprises?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a local .env file}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: bajaj_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
